[project]
name = "data-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "apache-airflow>=2.10",
    "dbt-core>=1.9",
    "dbt-postgres>=1.9",
    "pydantic>=2.9",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "sqlfluff>=3.2",
    "sqlfluff-templater-dbt>=3.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
