# Local development: Airflow (standalone) + Postgres warehouse
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER:-dev}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-dev}
      POSTGRES_DB: ${WAREHOUSE_DB:-warehouse}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER:-dev}"]
      interval: 5s
      retries: 5

  airflow:
    image: apache/airflow:2.10.4-python3.12
    command: standalone
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
      _PIP_ADDITIONAL_REQUIREMENTS: "pydantic>=2.9 tenacity>=9.0"
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./configs:/opt/airflow/configs
      - airflow-logs:/opt/airflow/logs

volumes:
  pgdata:
  airflow-logs:
